name: Daily News Intelligence

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          cat <<EOF > .env
          NEWS_SOURCES=${{ secrets.NEWS_SOURCES }}
          MAX_ARTICLES=${{ secrets.MAX_ARTICLES || '10' }}
          HISTORICAL_DAYS=${{ secrets.HISTORICAL_DAYS || '30' }}

          AI_PROVIDER=${{ secrets.AI_PROVIDER }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}

          EMAIL_PROVIDER=${{ secrets.EMAIL_PROVIDER }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          EMAIL_RECIPIENT=${{ secrets.EMAIL_RECIPIENT }}

          SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EOF

      - name: Run morning news pipeline
        run: python main.py
